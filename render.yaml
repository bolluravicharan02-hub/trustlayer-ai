services:
  # 1. Backend Web Service (Node.js + Express)
  - type: web
    name: trustlayer-ai-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_APP_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_NAME
        value: trustlayer.sid
      - key: SESSION_MAX_AGE_MS
        value: "86400000"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: TRUST_PROXY
        value: "true"
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-2-latest
      - key: GROK_BASE_URL
        value: https://api.x.ai/v1

  # 2. Frontend Static Site (React 18 + Vite SPA)
  - type: web
    name: trustlayer-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_APP_ENV
        value: production
